# spoond image manifest
#
# Source of truth for baked images. One image per
# capability — name by capability, never by repo or project. Many Go
# repos share one `go-base`; many review jobs share one `llm-review`.
#
# This file is what the image-inquiry process consults. When you point
# the agent at a repo, it detects the repo's language/capability, checks
# this manifest, and only bakes a NEW image when a genuinely new
# capability is missing.
#
# Fields:
#   name        unique image name (lease API `image`)
#   capability  the job capability this image provides (one per image)
#   labels      runs-on labels that map to this image (IMAGE_MAP keys)
#   description what's in it / what it's for
#   baked       true for every image built into an E2B template
#               (keeps validate-image.py working)
#   dockerfile  file name in images/
#   vcpu        1 or an even number
#   memory_mb   even, >= 128
#   disk_mb     free disk space (MB) guaranteed in the guest rootfs; sent as
#               diskSizeMB. The final rootfs size is rootfsSizeKey
#   min_memory_mb  the smallest memory a lease of this image may ask for
#               (optional; default 512, or memory_mb when that is smaller)
#   warm_sizes  size presets (SIZE_PRESETS names, e.g. [medium, large])
#               built as extra memory snapshots, so a lease at that size
#               starts warm instead of cold-booting (optional). vcpu and
#               memory_mb above are the image's default size, always warm.
#               Each preset's memory must be >= the effective min_memory_mb.
#   from        catalog image this one is built on (BASE build arg); vcpu,
#               memory_mb, disk_mb, min_memory_mb, warm_sizes and env are
#               inherited unless set here (warm_sizes: [] builds none).
#               Inherited warm_sizes are the base's warm builds in the
#               catalog at build time; while the base is rebuilding its
#               own, list warm_sizes here to not depend on that.
#   env         env vars passed on every sandbox create (process defaults)
#   notes       freeform

images:
  - name: py-base
    capability: python
    labels: [python, py, py-base, ubuntu-latest]
    description: "Python 3.12 slim base for Python build/test/CI jobs"
    baked: true
    dockerfile: py-base.dockerfile
    vcpu: 2
    memory_mb: 1024
    disk_mb: 4096
    env:
      PATH: /usr/local/bin:/usr/local/sbin:/usr/sbin:/usr/bin:/sbin:/bin
    notes: "First image baked 2026-08-07. DEFAULT_IMAGE fallback for the runner."

  - name: go-base
    capability: golang
    labels: [go, golang]
    description: "Go 1.25.12 toolchain (go/gofmt symlinked into /usr/local/bin) + git for Go build/test/CI jobs"
    baked: true
    dockerfile: go-base.dockerfile
    vcpu: 2
    memory_mb: 2048
    disk_mb: 6144
    env:
      PATH: /usr/local/go/bin:/usr/local/bin:/usr/local/sbin:/usr/sbin:/usr/bin:/sbin:/bin
      GOCACHE: /root/.cache/go-build
      GOPATH: /root/go
    notes: "Re-baked 2026-08-09 from golang:1.25 (was 1.24 — go.mod needed >=1.25.0). Memory 2 GiB (512 MiB OOM'd the Go compiler). PATH fix: symlink go/gofmt into /usr/local/bin (guest agent uses default PATH, not Docker ENV). GOCACHE/GOPATH default to /root (rootfs, 935M free) — do NOT point them at /tmp (256M tmpfs). Built via CLI snapshot --mem-size-mib 2048 + branch (M2.1)."

  - name: dev-base
    capability: interactive-dev
    labels: [dev]
    description: "Interactive dev environment: tmux 3.4 + sshd + git + python3 + build tools. SSH in, attach to tmux session 'dev'."
    baked: true
    dockerfile: dev-base.dockerfile
    vcpu: 2
    memory_mb: 2048
    disk_mb: 8192
    env:
      PATH: /usr/local/bin:/usr/local/sbin:/usr/sbin:/usr/bin:/sbin:/bin
      LANG: C.UTF-8
    notes: "Built 2026-08-09 from ubuntu:24.04 + tmux/openssh-server/git/python3/build-essential. 2 GiB memory. images/guest/spoond-guest-init runs the /etc/spoond/init.d hooks and marks the guest ready; /etc/profile.d/spoond-tmux.sh attaches-to-or-creates tmux session 'dev' on SSH login (skip with SPOOND_NO_TMUX; the pre-2.0 FORKD_NO_TMUX name still works). For exe.dev interactive sessions (ticket #18, U4). Built as a template so the memory state has the guest ready."

  - name: elixir-base
    capability: elixir
    labels: [elixir, postgres]
    description: "Elixir 1.19.6 / Erlang OTP 28.5.0.7 + git, build-essential, Python 3, and a PostgreSQL 17 server running on 127.0.0.1:5432 (user postgres, password postgres) for Elixir build/test/CI jobs"
    baked: true
    dockerfile: elixir-base.dockerfile
    vcpu: 2
    memory_mb: 4096
    disk_mb: 8192
    env:
      PATH: /usr/local/bin:/usr/local/sbin:/usr/sbin:/usr/bin:/sbin:/bin
      LANG: C.UTF-8
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    notes: |
      Rebuilt 2026-10-13 from hexpm/elixir:1.19.6-erlang-28.5.0.7-debian-trixie-20261005
      (was elixir:1.17.3-otp-27). Postgres starts from /etc/spoond/init.d/50-postgres
      (images/elixir-base-postgres-hook.sh); a bake snapshots it serving. Larger sizes
      (memory_mb 8192 for an umbrella compile + suite) cold-boot and start it the same way.

  - name: elixir-release
    capability: elixir-release
    labels: [elixir-release, release]
    description: "Elixir 1.18 / OTP 27 + Rust stable (pinned CARGO_HOME) + Node 22/pnpm + kaniko — full Phoenix+NIF release builds (origin: cytale deploy pipeline)"
    baked: true
    dockerfile: elixir-release.dockerfile
    vcpu: 4
    memory_mb: 4096
    disk_mb: 12288
    env:
      PATH: /usr/local/cargo/bin:/usr/local/bin:/usr/local/sbin:/usr/sbin:/usr/bin:/sbin:/bin
      CARGO_HOME: /usr/local/cargo
      LANG: C.UTF-8
    notes: |
      Build with `spoond images build elixir-release` (dockerfile: images/elixir-release.dockerfile).
      Sizing per rust-base notes: rootfs 12 GiB, memory 4 GiB — Tantivy-class Rust
      NIF builds + hex deps + node_modules + _build peak well past 8 GiB. Rust homes
      pinned to /usr/local/{rustup,cargo} so cache mounts can never mask toolchain
      binaries. kaniko baked in for daemonless image push (sandboxes have no docker).
      First bake: 2026-09-08. BAKE GOTCHAS (each cost a bake cycle):
      - host docker builds need --network=host --security-opt seccomp=unconfined
        (the host's default docker seccomp profile denies thread creation and
        AF_UNIX; Erlang can't boot there at all — no mix RUNs in the dockerfile).
      - curl | sh silently succeeds with nothing installed when the download
        fails; Rust is COPY'd from rust:1-bookworm with a rustc --version guard.
      - The template build keys on the image digest; re-building over a live
        tag leaves the registry's old rootfs in place — the builder pulls the
        new digest and the old build is reclaimed by the catalog GC.
      - The guest agent's exec PATH is a hardcoded default; /etc/environment is
        not applied. Toolchains must expose binaries in /usr/local/bin (go-base
        pattern). rustc/cargo are direct symlinks to the toolchain, bypassing
        the rustup proxy (which needs RUSTUP_HOME env the agent won't pass).
      - images/guest/spoond-guest-init writes the build-time resolver(s)
        (SPOOND_GUEST_DNS_ADDR, comma-separated, one nameserver line each)
        only — sandbox DNS is otherwise public, and
        the internal git host then resolves to the public edge whose /v2/
        registry path is SSO-gated (302 to login).

  - name: llm-review
    capability: llm-review
    labels: [llm-review]
    description: "Python 3.12 + git + curl for LLM code-review jobs (language-agnostic)"
    baked: true
    dockerfile: llm-review.dockerfile
    vcpu: 2
    memory_mb: 1024
    disk_mb: 4096
    env:
      PATH: /usr/local/bin:/usr/local/sbin:/usr/sbin:/usr/bin:/sbin:/bin
    notes: "Baked 2026-08-08 from python:3.12-slim + git + curl. Runs .forgejo/scripts/llm-review.py (pure Python stdlib)."

  - name: rust-base
    capability: rust
    labels: [rust, rust-lang]
    description: "Rust stable toolchain + git for Rust build/test/CI jobs"
    baked: false
    notes: |
      Not yet permanently baked. During initial testing (2026-08-11) a rust-base
      snapshot was built from rust:1.85-bookworm but hit several issues:

      1. DISK: cargo test requires full compilation + linking of the
         dependency tree. A 4 GiB rootfs is insufficient — the Rust toolchain
         (~1.5 GiB) + cargo registry (~200 MiB) + build artifacts (2+ GiB)
         + project source exceeds the rootfs. Minimum recommended rootfs:
         8 GiB (disk_mb: 8192).

      2. MEMORY: 512 MiB default OOM-kills cargo check during tokio compilation.
         Need at least 4 GiB RAM (memory_mb: 4096).

      3. RUSTUP FRICTION: Docker rust images ship rustup without a default
         toolchain. rust-toolchain.toml with channel="stable" causes rustup to
         download the latest stable, which may not fit on the rootfs. Workarounds:
         - Pre-set `rustup default stable` during image bake (before snapshot)
         - Or bypass rustup: set PATH to the toolchain binaries directly
         - Or set RUSTUP_TOOLCHAIN to the pre-installed version
         - Pin incompatible deps with `cargo update --precise` if using an
           older toolchain (e.g. time needs 1.88, icu_* needs 1.86)

      4. PATH: envd's exec PATH is a hardcoded default; /etc/environment is
         not applied. Ensure the manifest's env PATH includes
         /usr/local/cargo/bin before building the template.

      Build command (once the sizing above is settled):
        spoond images build rust-base

      python3 is required by the guest init hooks.

  - name: rust-qt-base
    capability: rust-qt
    labels: [rust-qt, qt6, qml]
    description: "Rust 1.99.0 from Arch (rustfmt, clippy, cargo-deny, sccache, mold) + Qt 6.12 (base, declarative, svg, multimedia, shadertools, tools) on Arch (archive 2026/10/10); headless GUI tests (offscreen/llvmpipe, xvfb-run), dbus + gnome-keyring, pinned fonts"
    baked: true
    dockerfile: rust-qt-base.dockerfile
    vcpu: 2
    memory_mb: 4096
    disk_mb: 8192
    warm_sizes: []
    env:
      PATH: /root/.cargo/bin:/usr/lib/qt6/bin:/usr/local/bin:/usr/local/sbin:/usr/sbin:/usr/bin:/sbin:/bin
      CARGO_HOME: /root/.cargo
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
      RUSTC_WRAPPER: sccache
      SCCACHE_DIR: /root/.cache/sccache
      LANG: C.UTF-8
      TZ: UTC
      QT_QPA_PLATFORM: offscreen
    notes: |
      Generic Rust + Qt Quick image (owner 2026-10-11: generic, not one
      project's). Sized by measurement, not request: medium (2 vCPU /
      4 GiB, 8 GiB disk headroom). Validated 2026-10-12 on sb with
      lacy.casa/rust-qt-smoke bin/smoke (SMOKE OK): clippy 305 s / peak
      325 MiB, release build 334 s / 327 MiB, unit tests 335 s / 220 MiB,
      QML tests 6 s; target/ 1.2 GB, sccache 270 MB, rootfs 47% used;
      fmt + clippy then passed with the lease's network off. The lean env (line-tables-only
      debuginfo, no incremental, mold, sccache) keeps target/ and link
      memory small; a project's own Cargo profile still wins. Implement
      loops should run cargo check/clippy + affected tests; full
      build/test/screenshots belong at the merge gate. Raise the size only
      on measured memory_peak_mb / size_hint. No QtWebEngine (QtPdf): a
      layered rust-qt-pdf variant if needed. Validated with
      lacy.casa/rust-qt-smoke (bin/smoke). Rebuild in place to move the
      snapshot date, which moves Rust and Qt together (ARCH_SNAPSHOT
      build arg). No rustup: Arch's rust package, offline-safe.

  - name: scylla
    capability: cql-database
    labels: []
    description: "ScyllaDB 2026.2.6, single node, developer mode — a SERVICE image: leased per job with expose_ports [9042] and reached from the job's sandbox (#70). Not a runs-on image."
    baked: true
    dockerfile: scylla.dockerfile
    vcpu: 2
    memory_mb: 3072
    disk_mb: 6144
    env:
      PATH: /usr/local/bin:/usr/local/sbin:/usr/sbin:/usr/bin:/sbin:/bin
    notes: |
      First baked 2026-09-26; a fresh fork answered CQL 769 ms after restore.
      Build with `spoond images build scylla` (images/scylla.dockerfile + images/scylla-init-hook.sh).
      Needs images/guest/spoond-guest-init in the image: its
      /etc/spoond/init.d hook runner starts ScyllaDB BEFORE the snapshot
      so every fork restores serving. seastar also needs cgroup2 mounted
      ("sstring out of range" without it); E2B guests boot with systemd,
      which mounts it. Guest 3 GiB, seastar --memory=1200M (1536M does not fit beside seastar's OS reserve),
      --overprovisioned (no busy-polling — idle pool children stay cheap).
      No labels: a job leases it via the lease API, it never runs a job.
      Warm pool: the first lease registers the tag, after which POOL_SIZE
      children stay warm (~2 GiB each) — instant starts, bounded cost.
      Base image is Debian 12 (E2B's template builder rejects the RHEL-based
      upstream image); python3 is already there.
