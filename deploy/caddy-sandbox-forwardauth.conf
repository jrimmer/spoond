# Staged: Caddy forward-auth block for sandbox.lacy.casa (epic #26 T7/#34)
# Apply on CT131 (10.1.0.203) in /etc/caddy/Caddyfile — REVIEW ONLY.
# Authelia verify endpoint + per-user DNS changes are NOT applied yet.
#
# Requires: PROXY_AUTH_MODE=forward-auth + PROXY_AUTH_SECRET on the
# spoond backend unit (vm2), and per-user wildcard CNAMEs in Technitium
# (*.<user>.sandbox.lacy.casa -> sandbox.lacy.casa).

# Shared secret between Caddy and spoond (generate with
# openssl rand -hex 24; same value in the backend unit env).
# Set as an env var or Caddy global: {env.SPOOND_PROXY_SECRET}
# !env.SPOOND_PROXY_SECRET

*.sandbox.lacy.casa {
    # Strip any client-supplied auth headers (defense in depth).
    header_down Remote-User
    header_down Remote-Name
    header_down Remote-Email
    header_down Remote-Groups
    header_down X-Proxy-Auth

    # Authelia forward-auth (v4.38+ verify endpoint).
    @auth {
        not path /llm/* /assets/*
    }
    handle @auth {
        reverse_proxy {
            to auth.lacy.casa:443
            transport http {
                tls
            }
            header_up X-Forwarded-Host {host}
            header_up X-Forwarded-Uri {uri}
            header_up X-Forwarded-Method {method}
            # Authelia session cookie auth
            header_up Cookie {header.Cookie}
        }
        handle_response 200 {
            copy_headers Remote-User Remote-Name Remote-Email Remote-Groups
            reverse_proxy 10.1.0.11:8891 {
                header_up X-Proxy-Auth {env.SPOOND_PROXY_SECRET}
            }
        }
        # 401/403 from Authelia pass through to the browser.
    }

    # LLM + assets stay open (capability model; guest-only paths).
    handle /llm/* {
        reverse_proxy 10.1.0.11:8891
    }
    handle /assets/* {
        reverse_proxy 10.1.0.11:8891
    }

    reverse_proxy 10.1.0.11:8891
}

# Technitium (per user, run at user creation):
#   *.jason.sandbox.lacy.casa  CNAME  sandbox.lacy.casa
#   *.trina.sandbox.lacy.casa  CNAME  sandbox.lacy.casa
# Caddy wildcard host: verify `caddy adapt` accepts *.*.sandbox.lacy.casa
# or use the existing * catch-all with the 2-label hostname parsed by
# spoond's parseProxyHost2 (label.<user>.sandbox.lacy.casa).
