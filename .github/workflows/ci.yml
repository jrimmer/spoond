name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: gofmt check
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "gofmt needed on:"; echo "$out"; exit 1; fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test (unit)
        run: go test ./...

  integration:
    # The full integration suite needs a live forkd homelab (controller,
    # warm pool, microVM images) and CANNOT run on GitHub-hosted runners.
    # Run it manually on your own forkd host:
    #   SSHHOST=root@<vm> BE_API=https://127.0.0.1:8890 bash tests/integration/run.sh
    runs-on: ubuntu-latest
    if: false
    steps:
      - run: echo "Integration suite is gated off CI — see tests/integration/README.md"
